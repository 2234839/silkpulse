<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React 18 devtools 测试页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    .demo { padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; margin: 16px 0; }
    button { padding: 8px 16px; margin: 4px; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    .counter { font-size: 32px; font-weight: bold; color: #61dafb; }
    ul { padding-left: 20px; }
    li { margin: 4px 0; }
    .user-card { padding: 12px; background: #f0f7ff; border-radius: 8px; }
  </style>
  <!-- SilkPulse SDK 必须在 React 之前加载：hook stub 要在 react-dom inject 前挂上 -->
  <script src="http://localhost:8080/sdk.js" data-server="http://localhost:8080"></script>
  <!-- React 18 UMD build（dev 版） -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <!-- Babel standalone：浏览器里跑 JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useCallback } = React

    /** 子组件：验证组件树嵌套 */
    function UserCard({ name, age }) {
      return (
        <div className="user-card">
          <strong>👤 你好，{name}（{age} 岁）</strong>
          <p>这是一个子组件，在 DevTools 组件树中应显示为 UserCard</p>
        </div>
      )
    }

    /** TodoItem：验证 v-for/map 列表渲染 */
    function TodoItem({ todo, onToggle }) {
      return (
        <li>
          <label>
            <input
              type="checkbox"
              checked={todo.done}
              onChange={() => onToggle(todo.id)}
            />
            {' '}
            <span style={todo.done ? { textDecoration: 'line-through', color: '#999' } : {}}>
              {todo.text}
            </span>
          </label>
        </li>
      )
    }

    function App() {
      const [count, setCount] = useState(0)
      const [newTodo, setNewTodo] = useState('')
      const [todos, setTodos] = useState([
        { id: 1, text: '验证组件树面板', done: true },
        { id: 2, text: '验证状态检查器', done: false },
        { id: 3, text: '验证 Profiler（未接）', done: false },
      ])
      const [userName, setUserName] = useState('gs')

      const addTodo = useCallback(() => {
        if (!newTodo.trim()) return
        setTodos((prev) => [...prev, { id: Date.now(), text: newTodo.trim(), done: false }])
        setNewTodo('')
      }, [newTodo])

      const toggleTodo = useCallback((id) => {
        setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t)))
      }, [])

      const doneCount = useMemo(() => todos.filter((t) => t.done).length, [todos])

      return (
        <div>
          <h1>React 18 devtools 测试页</h1>
          <p>这个页面用 React 18 渲染，注入了 silkpulse SDK，用来验证控制台里的 React DevTools 集成。</p>

          <div className="demo">
            <h3>计数器（useState）</h3>
            <div className="counter">{count}</div>
            <button onClick={() => setCount(count + 1)}>+1</button>
            <button onClick={() => setCount(count - 1)}>-1</button>
            <button onClick={() => setCount(0)}>重置</button>
          </div>

          <div className="demo">
            <h3>Todo 列表（组件树 + map 渲染）</h3>
            <input
              type="text"
              placeholder="输入待办..."
              value={newTodo}
              onChange={(e) => setNewTodo(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addTodo()}
            />
            <button onClick={addTodo}>添加</button>
            <ul>
              {todos.map((todo) => (
                <TodoItem key={todo.id} todo={todo} onToggle={toggleTodo} />
              ))}
            </ul>
            <p>完成：{doneCount} / {todos.length}</p>
          </div>

          <div className="demo">
            <h3>子组件（嵌套组件树验证）</h3>
            <UserCard name={userName} age={18} />
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)

    console.log('React app mounted. hook:', typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__)
  </script>
</body>
</html>
