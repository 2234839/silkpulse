<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 devtools 测试页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    .demo { padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; margin: 16px 0; }
    button { padding: 8px 16px; margin: 4px; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    .counter { font-size: 32px; font-weight: bold; color: #42b883; }
    ul { padding-left: 20px; }
    li { margin: 4px 0; }
  </style>
  <!-- SilkPulse SDK 必须在 Vue 之前加载：devtools hook 要在 createApp 前挂上 -->
  <script src="/sdk.js"></script>
  <!-- Vue 3 global build（dev 版，devtools 支持 timezone 更全） -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ title }}</h1>
    <p>这个页面用 Vue 3 渲染，注入了 silkpulse SDK，用来验证控制台里的 Vue DevTools 集成。</p>

    <div class="demo">
      <h3>计数器（reactive state）</h3>
      <div class="counter">{{ count }}</div>
      <button @click="count++">+1</button>
      <button @click="count--">-1</button>
      <button @click="count = 0">重置</button>
    </div>

    <div class="demo">
      <h3>Todo 列表（组件树 + v-for）</h3>
      <input v-model="newTodo" placeholder="输入待办..." @keyup.enter="addTodo" />
      <button @click="addTodo">添加</button>
      <ul>
        <li v-for="todo in todos" :key="todo.id">
          <label>
            <input type="checkbox" v-model="todo.done" />
            <span :style="todo.done ? 'text-decoration: line-through; color: #999' : ''">{{ todo.text }}</span>
          </label>
        </li>
      </ul>
    </div>

    <div class="demo">
      <h3>子组件（嵌套组件树验证）</h3>
      <user-card :name="userName" :age="userAge"></user-card>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, defineComponent } = Vue

    /** 子组件：验证 devtools 组件树嵌套 */
    const UserCard = defineComponent({
      name: 'UserCard',
      props: { name: String, age: Number },
      setup(props) {
        const greeting = computed(() => `你好，${props.name}（${props.age} 岁）`)
        return { greeting }
      },
      template: `
        <div style="padding:12px;border:1px solid #42b883;border-radius:8px;">
          <strong>👤 {{ greeting }}</strong>
          <p style="color:#666;font-size:13px;">这是一个子组件，在 DevTools 组件树中应显示为 UserCard</p>
        </div>
      `,
    })

    const app = createApp({
      components: { UserCard },
      setup() {
        const title = ref('Vue 3 devtools 测试页')
        const count = ref(0)
        const newTodo = ref('')
        const todos = reactive([
          { id: 1, text: '验证组件树面板', done: true },
          { id: 2, text: '验证状态检查器', done: false },
          { id: 3, text: '验证 Pinia（未接）', done: false },
        ])
        const userName = ref('gs')
        const userAge = ref(18)

        function addTodo() {
          const text = newTodo.value.trim()
          if (!text) return
          todos.push({ id: Date.now(), text, done: false })
          newTodo.value = ''
        }

        return { title, count, newTodo, todos, userName, userAge, addTodo }
      },
    })

    app.mount('#app')
    console.log('[vue-test-page] Vue app 已挂载，检查 __VUE_DEVTOOLS_GLOBAL_HOOK__:', !!window.__VUE_DEVTOOLS_GLOBAL_HOOK__)
  </script>
</body>
</html>
