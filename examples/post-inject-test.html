<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 生产构建 - 后注入测试页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    .demo { padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; margin: 16px 0; }
    button { padding: 8px 16px; margin: 4px; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    .counter { font-size: 32px; font-weight: bold; color: #42b883; }
  </style>
  <!--
    后注入场景测试页：
    1. 用 Vue 生产构建（vue.global.prod.js）——模拟真实线上部署的编译后应用
    2. 不在 HTML 里加载 sdk.js——Vue app 完全启动后再由测试脚本动态注入 SDK
    3. 验证 recoverExistingVueApps 能扫到 __vue_app__ 并补注册到 devtools-kit
  -->
  <!-- 用本地依赖里的 Vue 生产构建，版本 3.5.40，路径见 scripts 同步逻辑 -->
  <script src="/vendor/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ title }}</h1>
    <div class="demo">
      <h3>计数器</h3>
      <div class="counter">{{ count }}</div>
      <button @click="count++">+1</button>
    </div>
    <div class="demo">
      <h3>用户卡片（子组件）</h3>
      <user-card :name="userName" :age="userAge"></user-card>
    </div>
  </div>

  <script>
    const { createApp, ref, defineComponent } = Vue

    /** 子组件：验证组件树嵌套（prod 构建无 name 提示，靠 displayName 链） */
    const UserCard = defineComponent({
      name: 'UserCard',
      props: { name: String, age: Number },
      template: `<div class="user-card" style="padding:12px;border:1px solid #ddd;border-radius:6px">
        <strong>{{ name }}</strong>（{{ age }} 岁）
      </div>`,
    })

    const app = createApp({
      name: 'ProdApp',
      components: { UserCard },
      setup() {
        const title = ref('Vue 3 生产构建页面')
        const count = ref(42)
        const userName = ref('gs')
        const userAge = ref(18)
        return { title, count, userName, userAge }
      },
      template: `<div>
        <h1>{{ title }}</h1>
        <div class="demo">
          <div class="counter">{{ count }}</div>
          <button id="inc-btn" @click="count++">+1</button>
        </div>
        <div class="demo">
          <user-card :name="userName" :age="userAge"></user-card>
        </div>
      </div>`,
    })

    app.mount('#app')
    /** 给测试脚本一个标记：Vue app 已完全启动，此刻注入 SDK = 后注入 */
    window.__TEST_PAGE_READY__ = true
    window.__TEST_APP__ = app
  </script>
</body>
</html>
