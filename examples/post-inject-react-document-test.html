<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Document root - 后注入测试页</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .demo {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin: 16px 0;
      }
      button {
        padding: 8px 16px;
        margin: 4px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
      .counter {
        font-size: 32px;
        font-weight: bold;
        color: #61dafb;
      }
    </style>
    <!--
    复现 Next.js App Router 的 Document root 后注入场景：
    1. React 18.3.1 生产构建先完成渲染，SDK 由测试脚本随后注入
    2. root 容器是 document，而非 div#root；root 标记只挂在 document 上
    3. 验证框架探测、recoverReactRoots 与组件树兜底不会漏掉 Document 容器
    -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
  </head>
  <body>
    <script>
      const { useState, useCallback } = React;
      const e = React.createElement;

      function UserCard({ name, age }) {
        return e(
          "div",
          {
            className: "user-card",
            style: { padding: "12px", border: "1px solid #ddd", borderRadius: "6px" },
          },
          e("strong", null, name),
          `（${age} 岁）`,
        );
      }
      UserCard.displayName = "UserCard";

      function ProdApp() {
        const [count, setCount] = useState(42);
        const [userName] = useState("gs");
        const inc = useCallback(() => setCount((c) => c + 1), []);
        return e(
          "main",
          null,
          e("h1", null, "React Document root 后注入页面"),
          e(
            "div",
            { className: "demo" },
            e("div", { className: "counter" }, String(count)),
            e("button", { id: "inc-btn", onClick: inc }, "+1"),
          ),
          e("div", { className: "demo" }, e(UserCard, { name: userName, age: 18 })),
        );
      }
      ProdApp.displayName = "ProdApp";

      /** 与 Next.js App Router 一致，整个 document 是 React root 容器 */
      function DocumentRoot() {
        return e(
          "html",
          { lang: "zh-CN" },
          e("head", null, e("title", null, "React Document root - 后注入测试页")),
          e("body", null, e(ProdApp)),
        );
      }
      DocumentRoot.displayName = "DocumentRoot";

      ReactDOM.createRoot(document).render(e(DocumentRoot));
      window.__TEST_PAGE_READY__ = true;
    </script>
  </body>
</html>
