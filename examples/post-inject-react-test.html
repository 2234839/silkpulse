<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React 18 生产构建 - 后注入测试页</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .demo {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin: 16px 0;
      }
      button {
        padding: 8px 16px;
        margin: 4px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
      .counter {
        font-size: 32px;
        font-weight: bold;
        color: #61dafb;
      }
    </style>
    <!--
    React 后注入场景测试页：
    1. React 18.3.1 生产构建（react-dom.production.min.js）——无 devtools 事件
    2. 不加载 sdk.js——React 完全渲染后由测试脚本动态注入 SDK
    3. 验证 recoverReactRoots：扫 __reactContainer$ → 合成 renderer → stub.inject
  -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { useState, useCallback } = React;
      const e = React.createElement;

      /** 子组件：验证 fiber 树嵌套 */
      function UserCard({ name, age }) {
        return e(
          "div",
          {
            className: "user-card",
            style: { padding: "12px", border: "1px solid #ddd", borderRadius: "6px" },
          },
          e("strong", null, name),
          `（${age} 岁）`,
        );
      }
      UserCard.displayName = "UserCard";

      function ProdApp() {
        const [count, setCount] = useState(42);
        const [userName] = useState("gs");
        const inc = useCallback(() => setCount((c) => c + 1), []);
        return e(
          "div",
          null,
          e("h1", null, "React 18 生产构建页面"),
          e(
            "div",
            { className: "demo" },
            e("div", { className: "counter" }, String(count)),
            e("button", { id: "inc-btn", onClick: inc }, "+1"),
          ),
          e("div", { className: "demo" }, e(UserCard, { name: userName, age: 18 })),
        );
      }
      ProdApp.displayName = "ProdApp";

      ReactDOM.createRoot(document.getElementById("root")).render(e(ProdApp));
      /** 给测试脚本标记：React 已完全渲染，此刻注入 SDK = 后注入 */
      window.__TEST_PAGE_READY__ = true;
    </script>
  </body>
</html>
