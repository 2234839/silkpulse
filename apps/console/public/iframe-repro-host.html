<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iframe back 复现 · host（模拟工作台宿主）</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 10px; font-size: 15px; }
    input { width: 66%; padding: 8px; font-size: 13px; }
    button { padding: 10px; margin: 8px 4px 8px 0; font-size: 13px; }
    #hostLog { white-space: pre-wrap; background: #111; color: #6cf; padding: 8px; font-size: 11px; height: 20vh; overflow: auto; }
    iframe { width: 100%; height: 55vh; border: 2px solid #c00; box-sizing: border-box; }
  </style>
</head>
<body>
  <input id="childUrl" value="/iframe-repro-child.html" />
  <button onclick="loadChild()">加载 iframe</button>
  <button onclick="hostPush()">宿主 pushState（联合历史夹带，判 H3）</button>
  <div>host: <span id="href"></span></div>
  <div id="hostLog"></div>
  <iframe id="f"></iframe>
  <script>
    const log = (m) => {
      const t = new Date().toISOString().slice(11, 23);
      const el = document.getElementById("hostLog");
      el.textContent += `[host ${t}] ${m}\n`;
      el.scrollTop = el.scrollHeight;
    };
    const showHref = () =>
      (document.getElementById("href").textContent = location.href + " | history.length=" + history.length);
    addEventListener("popstate", (e) => log(`host 被 pop！popstate state=${JSON.stringify(e.state)}`));
    addEventListener("hashchange", (e) => log(`host hashchange ${e.oldURL} → ${e.newURL}`));
    function loadChild() {
      document.getElementById("f").src = document.getElementById("childUrl").value;
      log(`加载 iframe: ${document.getElementById("childUrl").value}`);
    }
    function hostPush() {
      const tag = Date.now();
      history.pushState({ host: tag }, "", "#host" + tag);
      showHref();
      log(`宿主 pushState #host${tag}（此刻联合历史最新条目属于 host）`);
    }
    showHref();
    loadChild();
  </script>
</body>
</html>
