services:
  clarosight:
    build: .
    image: gs/clarosight:latest
    container_name: clarosight-app
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
    environment:
      - CLAROSIGHT_ADMIN_KEY=${CLAROSIGHT_ADMIN_KEY:-}
      - SILKPULSE_ADMIN_KEY=${CLAROSIGHT_ADMIN_KEY:-}
    restart: unless-stopped
    mem_limit: 512m
