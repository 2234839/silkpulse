packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  ws: ^8.18.0
  "@types/ws": ^8.5.13
  vue: ^3.5.13
  tailwindcss: ^4.0.0
  "@tailwindcss/vite": ^4.0.0
  "@vitejs/plugin-vue": ^6.0.8
  puppeteer-core: ^25.5.0
  modern-screenshot: ^4.7.0
  snapdom: ^0.1.2
  '@zumer/snapdom': ^2.23.2
  vue-router: ^5.2.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
